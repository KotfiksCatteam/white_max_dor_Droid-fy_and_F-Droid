name: Update F-Droid Repo

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Download APK and Make Repo safely
        run: |
          # Создаем папки
          mkdir -p repo
          mkdir -p downloads
          
          # Скачиваем APK во временную папку вне репозитория
          URL=$(curl -s https://api.github.com/repos/WhiteMAX-Mod/whitemaxmod/releases/latest | grep "browser_download_url" | cut -d '"' -f 4 | grep ".apk" | head -n 1)
          echo "Downloading from: $URL"
          curl -L -o downloads/app.apk "$URL"
          
          # Переходим в репозиторий и инициализируем
          cd repo
          if [ ! -f "config.py" ]; then
              fdroid init
          fi
          
          # Копируем APK в папку repo/repo для индексации, но саму папку с APK не будем коммитить
          mkdir -p ../repo/repo
          cp ../downloads/app.apk ../repo/repo/
          
          # Обновляем индекс (fdroid подтянет его из локальной подпапки)
          fdroid update -c
          
          # Удаляем тяжелый APK файл из папки repo перед деплоем
          rm -rf repo/app.apk
          rm -f ../downloads/app.apk

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: repo
          branch: gh-pages
