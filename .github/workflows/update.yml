name: Update F-Droid Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Generate clean F-Droid Repo
        run: |
          mkdir -p repo
          cd repo
          if [ ! -f "config.py" ]; then
              fdroid init
          fi
          
          # Получаем прямую ссылку на релиз и имя файла через GitHub API
          APK_URL=$(curl -s https://api.github.com/repos/WhiteMAX-Mod/whitemaxmod/releases/latest | grep "browser_download_url" | cut -d '"' -f 4 | grep ".apk" | head -n 1)
          VERSION=$(curl -s https://api.github.com/repos/WhiteMAX-Mod/whitemaxmod/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          
          echo "Using APK URL: $APK_URL for version $VERSION"
          
          # Создаем metadata для приложения, чтобы F-Droid знал откуда качать APK напрямую (без загрузки файла в репозиторий)
          mkdir -p metadata
          cat <<EOF > metadata/com.whitemax.mod.txt
          Categories: Games
          License: GPL-3.0-or-later
          WebSite: https://github.com/WhiteMAX-Mod/whitemaxmod
          SourceCode: https://github.com/WhiteMAX-Mod/whitemaxmod
          IssueTracker: https://github.com/WhiteMAX-Mod/whitemaxmod/issues
          Summary: WhiteMAX Mod
          Description: Automatically synced F-Droid repository.
          
          Builds:
            - versionaliname: $VERSION
              versioncode: 1
              commit: $VERSION
              subdir: .
              gradle:
                - yes
          
          Auto Update Mode: Static
          Update Check Mode: None
          Current Version: $VERSION
          Current Version Code: 1
          EOF

          # Обновляем индекс без локальных APK файлов
          fdroid update -c

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: repo
          branch: gh-pages
          exclude-assets: "app.apk"
