name: Update F-Droid Repo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install fdroidserver
        run: |
          sudo apt-get update
          sudo apt-get install -y fdroidserver

      - name: Generate Repo and Purge APK
        run: |
          mkdir -p repo
          cd repo
          if [ ! -f "config.py" ]; then
              fdroid init
          fi
          
          # Скачиваем APK для генерации индекса
          URL=$(curl -s https://api.github.com/repos/WhiteMAX-Mod/whitemaxmod/releases/latest | grep "browser_download_url" | cut -d '"' -f 4 | grep ".apk" | head -n 1)
          curl -L -o app.apk "$URL"
          
          # Обновляем индекс
          fdroid update -c
          
          # УБИВАЕМ APK НАВСЕГДА перед коммитом, чтобы он физически исчез
          find . -name "*.apk" -delete
          rm -f app.apk

      - name: Force Push Clean Repo via Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          cd repo
          git init
          git checkout -b gh-pages
          git add -A
          git commit -m "Update F-Droid index (no heavy apks)"
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          git push -f origin gh-pages
